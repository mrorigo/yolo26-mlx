[project]
name = "yolo26-mlx"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "mrorigo", email = "mrorigo@gmail.com" }
]
requires-python = ">=3.13"
dependencies = [
    "mlx>=0.32.2",
    "numpy>=2.5.3",
    "pillow>=12.3.0",
    "pyyaml>=6.0.3",
]

[project.scripts]
yolo26-mlx = "yolo26_mlx.cli:main"

[build-system]
requires = ["uv_build>=0.9.16,<0.10.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=9.1.1",
]
