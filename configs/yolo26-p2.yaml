# YOLO26 with a P2/4 detection head, for small objects.
#
# Same format as configs/yolo26.yaml (see the comments there). The backbone is identical;
# the head gains one extra fusion level so the detector also runs at stride 4, which
# gives it strides [4, 8, 16, 32] instead of [8, 16, 32].
#
# Channel counts are the architecture's (published YOLO26 numbers), independently
# confirmed by this implementation's parameter counts - see PROVENANCE.md.

nc: 80          # classes in the COCO-style label set
end2end: True    # build the NMS-free one-to-one head as well as the one-to-many head
reg_max: 1      # 1 = plain ltrb regression; only >1 would mean a DFL distribution

# Compound scaling: [depth multiplier, width multiplier, channel ceiling].
scales:
  n: [0.50, 0.25, 1024]
  s: [0.50, 0.50, 1024]
  m: [0.50, 1.00, 512]
  l: [1.00, 1.00, 512]
  x: [1.00, 1.50, 512]

# ---------------------------------------------------------------- backbone
# Identical to the P3-P5 variant: detection resolution is a head concern, not a
# backbone one, so the features at P2/4 are already there.
backbone:
  - [-1, 1, Conv, [64, 3, 2]]
  - [-1, 1, Conv, [128, 3, 2]]
  - [-1, 2, C3k2, [256, False, 0.25]]
  - [-1, 1, Conv, [256, 3, 2]]
  - [-1, 2, C3k2, [512, False, 0.25]]
  - [-1, 1, Conv, [512, 3, 2]]
  - [-1, 2, C3k2, [512, True]]
  - [-1, 1, Conv, [1024, 3, 2]]
  - [-1, 2, C3k2, [1024, True]]
  - [-1, 1, SPPF, [1024, 5, 3, True]]
  - [-1, 2, C2PSA, [1024]]

# -------------------------------------------------------------------- head
# The P3-P5 head, unchanged, plus one more top-down level fused with the backbone's
# P2/4 output (layer 2) and one more bottom-up hop back down to P3.
head:
  # Top-down: P5 -> P4 (fuse backbone layer 6), then P4 -> P3 (fuse backbone layer 4).
  - [-1, 1, nn.Upsample, [None, 2, "nearest"]]
  - [[-1, 6], 1, Concat, [1]]
  - [-1, 2, C3k2, [512, True]]           # -> P4/16
  - [-1, 1, nn.Upsample, [None, 2, "nearest"]]
  - [[-1, 4], 1, Concat, [1]]
  - [-1, 2, C3k2, [256, True]]           # -> P3/8

  # The extra level: keep going up to P2/4, fusing the stem output (layer 2).
  - [-1, 1, nn.Upsample, [None, 2, "nearest"]]
  - [[-1, 2], 1, Concat, [1]]
  - [-1, 2, C3k2, [128, True]]           # -> P2/4, the finest detection stride

  # Bottom-up: P2 -> P3 (fuse layer 16), P3 -> P4 (fuse layer 13), P4 -> P5 (fuse layer 10).
  - [-1, 1, Conv, [128, 3, 2]]
  - [[-1, 16], 1, Concat, [1]]
  - [-1, 2, C3k2, [256, True]]           # -> P3/8
  - [-1, 1, Conv, [256, 3, 2]]
  - [[-1, 13], 1, Concat, [1]]
  - [-1, 2, C3k2, [512, True]]           # -> P4/16
  - [-1, 1, Conv, [512, 3, 2]]
  - [[-1, 10], 1, Concat, [1]]
  - [-1, 1, C3k2, [1024, True, 0.5, True]]   # -> P5/32

  # Four detection strides now.
  - [[19, 22, 25, 28], 1, Detect, [nc]]
